name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --all-extras

      - name: Lint (Python)
        run: uv run ruff check src/

      - name: Test
        run: uv run pytest

      - name: Fleet E2E offline smoke
        run: uv run python scripts/fleet_e2e_smoke.py --offline --strict
