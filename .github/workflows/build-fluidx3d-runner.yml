# Build the FluidX3D Runner binary for all platforms.
# Runs 4 compilation jobs (Windows MSVC, Windows g++, Linux g++, macOS clang++).
# Uploads the runner as a release asset on tagged pushes.
name: Build FluidX3D Runner

on:
  workflow_dispatch:     # Manual trigger
  push:
    tags: ['v*']         # On version tags
    paths:
      - 'src/freecad_mcp/fluidx3d_runner/**'
      - 'scripts/build-fluidx3d-runner.ps1'

env:
  RUNNER_SRC: src/freecad_mcp/fluidx3d_runner/runner.cpp
  F3D_REPO: https://github.com/ProjectPhysX/FluidX3D.git

jobs:
  build-windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone FluidX3D
        run: git clone $env:F3D_REPO FluidX3D
      - name: Inject runner
        run: Copy-Item $env:RUNNER_SRC FluidX3D/src/setup.cpp -Force
      - name: Generate defines.hpp
        run: |
          @"
          #define FORCE_FIELD
          #define EQUILIBRIUM_BOUNDARIES
          "@ | Set-Content FluidX3D/src/defines.hpp -Force
      - name: Compile with MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd FluidX3D
          cl /EHsc /O2 /std:c++17 /Fe:fluidx3d-runner.exe src\*.cpp OpenCL.lib
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluidx3d-runner-windows-msvc
          path: FluidX3D/fluidx3d-runner.exe

  build-windows-gpp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone FluidX3D
        run: git clone $env:F3D_REPO FluidX3D
      - name: Inject runner
        run: Copy-Item $env:RUNNER_SRC FluidX3D/src/setup.cpp -Force
      - name: Generate defines.hpp
        run: |
          @"
          #define FORCE_FIELD
          #define EQUILIBRIUM_BOUNDARIES
          "@ | Set-Content FluidX3D/src/defines.hpp -Force
      - name: Install MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          version: 14.2.0
      - name: Compile with g++
        run: |
          cd FluidX3D
          g++ -std=c++17 -O3 -o fluidx3d-runner.exe src/*.cpp -lOpenCL
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluidx3d-runner-windows-gpp
          path: FluidX3D/fluidx3d-runner.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCL
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev mesa-opencl-icd
      - name: Clone FluidX3D
        run: git clone ${{ env.F3D_REPO }} FluidX3D
      - name: Inject runner
        run: cp ${{ env.RUNNER_SRC }} FluidX3D/src/setup.cpp
      - name: Generate defines.hpp
        run: |
          printf '#define FORCE_FIELD\n#define EQUILIBRIUM_BOUNDARIES\n' > FluidX3D/src/defines.hpp
      - name: Compile with g++
        run: |
          cd FluidX3D
          g++ -std=c++17 -O3 -o fluidx3d-runner src/*.cpp -lOpenCL
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluidx3d-runner-linux
          path: FluidX3D/fluidx3d-runner

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone FluidX3D
        run: git clone ${{ env.F3D_REPO }} FluidX3D
      - name: Inject runner
        run: cp ${{ env.RUNNER_SRC }} FluidX3D/src/setup.cpp
      - name: Generate defines.hpp
        run: |
          printf '#define FORCE_FIELD\n#define EQUILIBRIUM_BOUNDARIES\n' > FluidX3D/src/defines.hpp
      - name: Compile with clang++
        run: |
          cd FluidX3D
          clang++ -std=c++17 -O3 -o fluidx3d-runner src/*.cpp -framework OpenCL
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluidx3d-runner-macos
          path: FluidX3D/fluidx3d-runner

  ship:
    needs: [build-windows-msvc, build-windows-gpp, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fluidx3d-runner-windows-msvc/fluidx3d-runner.exe
            fluidx3d-runner-windows-gpp/fluidx3d-runner.exe
            fluidx3d-runner-linux/fluidx3d-runner
            fluidx3d-runner-macos/fluidx3d-runner
          tag_name: ${{ github.ref_name }}
          body: "FluidX3D Runner binaries for ${{ github.ref_name }}. See src/freecad_mcp/fluidx3d_runner/runner.cpp for source."
